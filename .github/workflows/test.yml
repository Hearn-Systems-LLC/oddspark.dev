name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # no dependencies to install; test.mjs imports src/worker.js directly
      # and runs against the live drand + NOAA feeds with a mocked AI binding
      - run: node test.mjs
