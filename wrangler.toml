name = "oddspark"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Swap models without touching code. When the day's neuron spend (tracked in
# the NeuronMeter Durable Object) passes 25% of the 10,000 free daily
# allocation, the worker switches from AI_MODEL to AI_MODEL_FALLBACK for the
# rest of the UTC day. An unknown model ID degrades to the raw seed rather
# than erroring out.
[vars]
AI_MODEL = "@cf/openai/gpt-oss-120b"
AI_MODEL_FALLBACK = "@cf/openai/gpt-oss-20b"

[ai]
binding = "AI"
remote = true

# Create with:  npx wrangler kv namespace create SPARKS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SPARKS"
id = "1a84502df1754aa5985648d803e6751e"
remote = true

# Strongly consistent neuron counter. Requires the Workers Paid plan.
[[durable_objects.bindings]]
name = "METER"
class_name = "NeuronMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NeuronMeter"]

# Attach the domain after the zone is active in Cloudflare.
[[routes]]
pattern = "oddspark.dev"
custom_domain = true

[observability]
enabled = true
